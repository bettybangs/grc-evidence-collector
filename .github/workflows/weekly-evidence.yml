# Collects compliance evidence every week and keeps it as a downloadable
# artifact on the workflow run.
name: Weekly evidence collection

on:
  schedule:
    - cron: "0 9 * * 1"  # Every Monday at 09:00 UTC
  workflow_dispatch:      # Adds a "Run workflow" button for manual runs

# The workflow's own built-in token only needs to read the code.
permissions:
  contents: read

jobs:
  branch-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check default-branch protection
        env:
          GITHUB_TOKEN: ${{ secrets.EVIDENCE_TOKEN }}
        run: python check_branch_protection.py ${{ github.repository }}

      - name: Save evidence
        if: always()  # Keep the evidence even when the check fails
        uses: actions/upload-artifact@v7
        with:
          name: evidence-branch-protection-${{ github.run_id }}
          path: evidence/
          retention-days: 90

  iam-mfa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check IAM users for MFA
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: python check_iam_mfa.py

      - name: Save evidence
        if: always()  # Keep the evidence even when the check fails
        uses: actions/upload-artifact@v7
        with:
          name: evidence-iam-mfa-${{ github.run_id }}
          path: evidence/
          retention-days: 90
